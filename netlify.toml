# Netlify detects Next.js and applies its Next.js adapter automatically
# (Next.js 13.5 and later). Don't add the @netlify/plugin-nextjs plugin here:
# pinning it switches the site to the legacy runtime.

[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  # pnpm is pinned by "packageManager" in package.json.
  NODE_VERSION = "22"

# Runtime settings can't live in this file: Netlify only exposes netlify.toml
# variables to the build, not to the functions that render the pages.
# Set these in the Netlify UI (Site configuration > Environment variables),
# with a scope that includes Functions:
#
#   NEXTAUTH_SECRET = a long random string, e.g. from: openssl rand -base64 32
#   AUTH_TRUST_HOST = true
#
# AUTH_TRUST_HOST makes sign-in use the URL the site is served from, so it
# works on the production URL, deploy previews and custom domains.
# Leave NEXTAUTH_URL unset on Netlify: when set, it takes precedence.
